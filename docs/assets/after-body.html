<script>
(function () {
  // ── Platform detection ──────────────────────────────
  var ua = navigator.userAgent;
  var isIOS     = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  window._dmPlatform = isIOS || isAndroid ? 'mobile'
                     : /Macintosh|Mac OS X/.test(ua)  ? 'mac'
                     : 'other'; // Windows, Linux, etc.

  // ── Helper: open / close any overlay ───────────────
  function openOverlay(id)  { var el = document.getElementById(id); if (el) el.classList.add('is-open'); }
  function closeOverlay(id) { var el = document.getElementById(id); if (el) el.classList.remove('is-open'); }
  function closeAll() {
    ['download-modal', 'dm-confirm-modal', 'dm-mobile-modal'].forEach(closeOverlay);
  }

  // Close on overlay click or Escape
  ['download-modal', 'dm-confirm-modal', 'dm-mobile-modal'].forEach(function (id) {
    var el = document.getElementById(id);
    el?.addEventListener('click', function (e) { if (e.target === el) closeOverlay(id); });
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });

  // ── Gatekeeper modal close button ──────────────────
  document.getElementById('modal-close-bottom')?.addEventListener('click', function () { closeOverlay('download-modal'); });

  // ── Confirm modal (Windows/Linux) ──────────────────
  document.getElementById('dm-confirm-cancel')?.addEventListener('click', function () { closeOverlay('dm-confirm-modal'); });
  document.getElementById('dm-confirm-ok')?.addEventListener('click', function () {
    closeOverlay('dm-confirm-modal');
    // Trigger download then show the Gatekeeper modal
    var url = document.getElementById('download-btn')?.href;
    if (url) window.location.href = url;
    setTimeout(function () { openOverlay('download-modal'); }, 300);
  });

  // ── Mobile modal ────────────────────────────────────
  document.getElementById('dm-mobile-ok')?.addEventListener('click', function () { closeOverlay('dm-mobile-modal'); });

  // ── Navbar "Buy" → checkout overlay ─────────────────
  // The navbar link can't carry the lemonsqueezy-button class from Quarto's config,
  // so upgrade any full-page checkout link to an overlay button. lemon.js delegates
  // clicks by class, so adding the class (and ?embed=1) here is enough.
  document.querySelectorAll('a[href*="lemonsqueezy.com/checkout"]:not(.lemonsqueezy-button)').forEach(function (a) {
    a.classList.add('lemonsqueezy-button');
    if (a.href.indexOf('embed=1') === -1) a.href += (a.href.indexOf('?') === -1 ? '?' : '&') + 'embed=1';
  });
})();

function openDownloadModal(e) {
  var platform = window._dmPlatform || 'mac';
  if (platform === 'mobile') {
    e.preventDefault();
    document.getElementById('dm-mobile-modal')?.classList.add('is-open');
  } else if (platform === 'other') {
    e.preventDefault();
    document.getElementById('dm-confirm-modal')?.classList.add('is-open');
  } else {
    // macOS: download proceeds normally, show the Gatekeeper modal
    document.getElementById('download-modal')?.classList.add('is-open');
  }
}
</script>

<script>
// Demo videos play while on screen and pause when scrolled away (seamless, no
// controls). Mark a video with class="scroll-video" (muted playsinline
// preload="metadata"; add loop for a GIF-like clip). No `autoplay` attribute —
// the observer drives playback; muted is required for autoplay to be allowed.
// For a non-looping clip a Replay pill appears once it ends; an Enlarge (⤢)
// button (and clicking the clip) opens it big in a fullscreen lightbox.
(function () {
  // ── Shared lightbox (one per page, created lazily) ───────────────────
  var box, boxVid, opener;   // opener = the inline clip currently enlarged
  function ensureLightbox() {
    if (box) return;
    box = document.createElement('div');
    box.className = 'sv-lightbox';
    boxVid = document.createElement('video');
    boxVid.setAttribute('playsinline', '');
    boxVid.controls = true;
    boxVid.addEventListener('ended', function () {   // videoautohide: linger on the last frame, then close
      setTimeout(function () { if (boxVid.ended) closeLightbox(); }, 700);
    });
    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'sv-lightbox-close';
    close.setAttribute('aria-label', 'Close');
    close.innerHTML = '&times;';
    box.appendChild(boxVid);
    box.appendChild(close);
    document.body.appendChild(box);
    close.addEventListener('click', closeLightbox);
    box.addEventListener('click', function (e) { if (e.target === box) closeLightbox(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && box.classList.contains('is-open')) closeLightbox();
    });
  }
  function openLightbox(v) {
    ensureLightbox();
    opener = v;
    try { v.pause(); } catch (e) {}
    boxVid.src = v.currentSrc || v.src;   // same file, already cached
    boxVid.muted = false;                 // user gesture → sound allowed (this clip has none)
    box.classList.add('is-open');
    document.body.style.overflow = 'hidden';   // lock the page behind
    try { boxVid.currentTime = 0; } catch (e) {}
    boxVid.play && boxVid.play().catch(function () {});
  }
  function closeLightbox() {
    if (!box) return;
    box.classList.remove('is-open');
    document.body.style.overflow = '';
    try { boxVid.pause(); } catch (e) {}
    // Clear the source only after the fade-out, so the frame doesn't blank mid-animation.
    setTimeout(function () {
      if (box && !box.classList.contains('is-open')) {
        boxVid.removeAttribute('src');
        boxVid.load && boxVid.load();
      }
    }, 320);
    if (opener) { play(opener); opener = null; }   // resume the inline clip we paused
  }

  // ── Per-clip controls: Replay pill + Enlarge button ──────────────────
  function setupControls(v) {
    var fig = v.closest('figure') || v.parentElement;
    if (!fig) return;
    if (getComputedStyle(fig).position === 'static') fig.style.position = 'relative';

    // Replay pill — shown on `ended`, hidden whenever it plays.
    var replay = document.createElement('button');
    replay.type = 'button';
    replay.className = 'scroll-video-replay';
    replay.setAttribute('aria-label', 'Replay');
    replay.innerHTML = '<i class="fa-solid fa-rotate-right" aria-hidden="true"></i>';
    replay.hidden = true;
    replay.addEventListener('click', function (e) {
      e.stopPropagation();                // don't open the lightbox
      replay.hidden = true;
      try { v.currentTime = 0; } catch (err) {}
      v.play && v.play().catch(function () {});
    });
    fig.appendChild(replay);
    v.addEventListener('ended', function () { replay.hidden = false; });
    v.addEventListener('play',  function () { replay.hidden = true; });

    // Enlarge affordance — reveals on hover; opens the lightbox.
    var expand = document.createElement('button');
    expand.type = 'button';
    expand.className = 'scroll-video-expand';
    expand.setAttribute('aria-label', 'Enlarge');
    expand.innerHTML = '<i class="fa-solid fa-expand" aria-hidden="true"></i>';
    expand.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(v); });
    fig.appendChild(expand);

    // Clicking the clip itself also enlarges it.
    v.style.cursor = 'zoom-in';
    v.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(v); });
  }

  function play(v) {
    if (v.ended) { try { v.currentTime = 0; } catch (e) {} }  // replay a finished clip
    v.play && v.play().catch(function () {});
  }

  function init() {
    var vids = document.querySelectorAll('video.scroll-video');
    if (!vids.length) return;
    vids.forEach(setupControls);
    if (!('IntersectionObserver' in window)) {          // old browsers: just play
      vids.forEach(function (v) { try { v.play(); } catch (e) {} });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { play(e.target); }
        else { e.target.pause && e.target.pause(); }
      });
    }, { threshold: 0.35 });
    vids.forEach(function (v) { io.observe(v); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
