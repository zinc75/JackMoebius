project:
  type: website
  output-dir: _site
  post-render:
    - scripts/seo-meta.sh        # per-page canonical + og:url (Quarto emits neither) + sitemap home fix
  resources:
    - CNAME                      # custom domain (jackmoebius.io) — copied into _site so the
                                 # GitHub Actions deploy keeps it (otherwise each deploy drops it)
    # Media referenced only from raw HTML blocks (<video>/<img src>) — Quarto
    # doesn't auto-detect these, so copy them into _site explicitly.
    - assets/video/**
    - assets/screenshots/**
    - assets/icon.png            # hero icon, also paired on guide/jackmate.qmd
    - assets/jackmate-icon.png   # JackMate icon for the pairing on guide/jackmate.qmd
    - assets/og-banner.png       # social card (og:image / twitter:image) — referenced only in meta tags, so copy explicitly
    - apple-touch-icon.png       # iOS home-screen icon (180x180), served at site root
    - favicon-32x32.png          # crisp 32px browser-tab favicon

website:
  title: "JackMoebius"
  description: "Route macOS CoreAudio apps to and from JACK, per app and bidirectionally."
  site-url: https://jackmoebius.io       # enables sitemap.xml + canonical links + absolute OG URLs
  repo-url: https://github.com/zinc75/JackMoebius
  favicon: assets/favicon.png
  open-graph: true
  twitter-card: true
  image: https://jackmoebius.io/assets/og-banner.png   # default social card; absolute so subdir pages resolve it

  navbar:
    pinned: true
    logo: assets/picto.png
    logo-alt: "JackMoebius"
    left:
      - href: index.qmd
        text: Home
      - href: video.qmd
        text: See it in action
        icon: play-btn
      - text: Guide
        menu:
          - href: guide/how-it-works.qmd
            text: How it works
          - href: guide/jackmate.qmd
            text: Use JackMoebius in JackMate
          - href: guide/ipc.qmd
            text: IPC protocol documentation
          - href: guide/cli.qmd
            text: Advanced Command Line documentation
      - href: changelog.qmd
        text: Changelog
      - href: "https://github.com/zinc75/JackMoebius/discussions"
        text: Support
        icon: life-preserver
    right:
      - text: '<span class="nav-buy">Buy a license</span>'
        href: "https://jackmoebius.lemonsqueezy.com/checkout/buy/8fe2de5a-5bb2-4c3d-b620-bd4b9ee2986c"
      - text: '<span class="nav-star"><i class="fa-solid fa-star nav-star-ic" aria-hidden="true"></i> Star on GitHub</span>'
        href: https://github.com/zinc75/JackMoebius
      - icon: github
        href: https://github.com/zinc75/JackMoebius

  sidebar:
    style: floating
    search: true
    contents:
      - video.qmd
      - section: "Guide"
        contents:
          - guide/how-it-works.qmd
          - guide/jackmate.qmd
          - guide/ipc.qmd
          - guide/cli.qmd
      - section: "Reference"
        contents:
          - changelog.qmd

  page-footer:
    center: "JackMoebius · © 2026 Éric Bavu · [Proprietary software](/eula.qmd)"

  back-to-top-navigation: true

format:
  html:
    theme: slate
    css: assets/custom.css
    include-in-header: assets/head.html   # Font Awesome via CDN (no extension needed)
    include-after-body: assets/after-body.html   # platform-aware download modals
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    smooth-scroll: true
    anchor-sections: true
