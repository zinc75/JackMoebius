name: Bug Report
description: Report a bug or unexpected behavior in JackMoebius
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill in as much information as possible — it helps a lot.

  - type: input
    id: jackmoebius_version
    attributes:
      label: JackMoebius version
      description: Run `jackmoebius --version` in Terminal (or check the installed .pkg)
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac
      placeholder: e.g. macOS 26 (Tahoe)
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Apple Silicon (M series / A series)
        - Intel
    validations:
      required: true

  - type: dropdown
    id: driven_by
    attributes:
      label: How do you drive JackMoebius?
      options:
        - JackMate (GUI)
        - jackmoebius (command line)
        - Both / Other
    validations:
      required: true

  - type: input
    id: jack_version
    attributes:
      label: JACK version
      description: Run `jackd --version`, or see JackMate's Configuration panel
      placeholder: e.g. 1.9.22

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the bug…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Install JackMoebius and reboot
        2. Start JACK, then expose an app (e.g. `jackmoebius add Music`)
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        If the bug has a visual component (routing in JackMate, wrong channels, missing box…),
        please attach one or more screenshots — they help pinpoint the problem much faster.
        Drag and drop images here or paste from clipboard.
      placeholder: Attach screenshots here (drag & drop or paste)

  - type: textarea
    id: logs
    attributes:
      label: Daemon / CLI output (optional)
      description: Paste relevant output from `jackmoebius status` or the jackmoebiusd log if applicable.
      render: shell
